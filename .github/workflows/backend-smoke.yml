name: Backend smoke (CPU, Gate 1)

# Issue #38: production weight/GPUを一切必要としないCPU CI gate。
# GitHub-hosted runnerのみを使用するため、fork PRからのpull_requestでも安全。
# production artifact（weight/fixture画像）はgitignore対象のためcheckoutに含まれず、
# Layer B/Cの該当部分は既存のSKIP設計により自動的にSKIPされる。

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install backend dependencies (CPU-only, no GPU/production artifact)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # backend/app/routers/model_export.py が backend/app/services/model_export_service.py
          # 経由で onnxruntime をモジュールレベルで import しているため、
          # `from app.main import app` の時点で必要（app boot自体に必要）。
          pip install onnx onnxruntime onnxslim
          # requirements-train.txt (CPU版、GPU/CUDA不要、real production weightも不要)。
          # 一部smoke test（例: smoke_video_inference.py の非dry-runパス、smoke_sam.py の
          # mock candidate生成）が、production weightの有無に関わらずcv2/ultralyticsの
          # import自体は必要とする設計のため、Gate 1のPoC実行で判明し追加した
          # （docs/CI_GPU_RUNNER.md §4参照。GPU/CUDAは一切使わず、real weightもGit管理外の
          # ためcheckoutに含まれず、Layer B/Layer Cの実推論部分は既存SKIP設計で回避される）。
          pip install -r requirements-train.txt

      - name: Run backend smoke suite (production artifacts absent -> auto-skip)
        working-directory: backend
        run: |
          for f in tests/smoke_*.py; do
            echo "=== $f ==="
            python "$f"
          done
