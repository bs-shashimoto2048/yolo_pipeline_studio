name: Backend smoke (CPU, Gate 1)

# Issue #38: production weight/GPUを一切必要としないCPU CI gate。
# GitHub-hosted runnerのみを使用するため、fork PRからのpull_requestでも安全。
# production artifact（weight/fixture画像）はgitignore対象のためcheckoutに含まれず、
# Layer B/Cの該当部分は既存のSKIP設計により自動的にSKIPされる。
#
# runs-on は windows-latest を使う（GitHub-hosted、GPU/self-hosted不要、無料枠内）。
# production appは`training_service.py`/`video_service.py`がWindows専用コマンド
# （`tasklist`、subprocess生存確認用）に依存しており、Issue #30/#33で実際に
# Windows固有のmultiprocessing spawn/file locking/PermissionErrorが問題になった実績
# もあるため、production parityの観点からWindowsで統一する（当初ubuntu-latestで
# 試したところ`tasklist`がなくFAILしたため、実PoC実行で判明し訂正した）。

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-smoke:
    runs-on: windows-latest
    env:
      # Windows runnerのデフォルトコンソールcodepage(cp1252等)では、smoke testが出力する
      # 日本語文字列のprint()がUnicodeEncodeErrorになるため、Python 3.7+のUTF-8 modeを
      # 強制する（実PoC実行でsmoke_dataset_builder.py等が実際にこれで落ちたため訂正）。
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Validate dataset split integrity
        # Issue #45: Layer A（repo-only、raw画像/cv2不要）のdataset split integrity監査。
        # 標準ライブラリのみで完結するため、依存インストール前に独立stepとして実行する
        # （dataset問題をbackend smoke失敗と混同せず素早く検知するため）。
        # visual near-duplicate監査（Layer B、raw画像必須）はここでは実行しない
        # （docs/CI_GPU_RUNNER.md参照、ローカル専用）。
        shell: bash
        run: |
          set -e
          for m in \
            "data_manifests/meter_src002_split_v3.csv:meter_src002" \
            "data_manifests/meter_src004_split_v4.csv:meter_src004" \
            "data_manifests/meter_src004_hard_val_v2.csv:meter_src004" \
          ; do
            manifest="${m%%:*}"
            project="${m##*:}"
            echo "=== $manifest (project=$project) ==="
            python scripts/audit_dataset_split.py \
              --manifest "$manifest" --project "$project" --ci \
              --baseline data_manifests/split_integrity_baseline.json
          done

      - name: Install backend dependencies (CPU-only, no GPU/production artifact)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # backend/app/routers/model_export.py が backend/app/services/model_export_service.py
          # 経由で onnxruntime をモジュールレベルで import しているため、
          # `from app.main import app` の時点で必要（app boot自体に必要）。
          pip install onnx onnxruntime onnxslim
          # requirements-train.txt (CPU版、GPU/CUDA不要、real production weightも不要)。
          # 一部smoke test（例: smoke_video_inference.py の非dry-runパス、smoke_sam.py の
          # mock candidate生成）が、production weightの有無に関わらずcv2/ultralyticsの
          # import自体は必要とする設計のため、Gate 1のPoC実行で判明し追加した
          # （docs/CI_GPU_RUNNER.md §4参照。GPU/CUDAは一切使わず、real weightもGit管理外の
          # ためcheckoutに含まれず、Layer B/Layer Cの実推論部分は既存SKIP設計で回避される）。
          pip install -r requirements-train.txt

      - name: Run backend smoke suite (production artifacts absent -> auto-skip)
        working-directory: backend
        shell: bash
        run: |
          for f in tests/smoke_*.py; do
            echo "=== $f ==="
            python "$f"
          done
